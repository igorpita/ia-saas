version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omniflow_postgres
    restart: always
    environment:
      POSTGRES_DB: ia_saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d ia_saas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omniflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: omniflow_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgres://saas_user:saas_secure_password_2026@postgres:5432/ia_saas_db
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=mv_evolution_secret_api_key_2026
      - WEBSOCKET_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy

  api-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: omniflow_api_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - JWT_SECRET=omniflow_super_secret_jwt_2026
      - DATABASE_URL=postgresql://saas_user:saas_secure_password_2026@postgres:5432/ia_saas_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=mv_evolution_secret_api_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
